name: deploy

# Placeholder — only builds until the deploy target is configured.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build
        env:
          USE_MOCK_DATA: "true"

      - run: echo "Deploy not configured yet — build verified, nothing deployed."
